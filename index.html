<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapse AI</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eef0f3;display:flex;flex-direction:column;height:100vh;}
  header{padding:14px 16px;border-bottom:1px solid #272b35;display:flex;align-items:center;gap:10px;}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b8cff,#8a5bff);display:flex;align-items:center;justify-content:center;font-weight:700;}
  header h1{font-size:1rem;margin:0;}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:.92rem;line-height:1.5;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:#5b8cff;color:#fff;}
  .msg.ai{align-self:flex-start;background:#1f232d;}
  form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #272b35;}
  input{flex:1;border:1px solid #272b35;background:#0f1115;color:#eef0f3;padding:11px 14px;border-radius:10px;font-size:.92rem;}
  button{background:#5b8cff;color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;}
</style>
</head>
<body>
<header><div class="logo">S</div><h1>Synapse AI</h1></header>
<div id="chat"><div class="msg ai">Assalamualaikum! Main Synapse AI hoon. Kuch bhi pooch sakte hain.</div></div>
<form id="form">
  <input id="input" type="text" placeholder="Apna sawal likhein..." autocomplete="off">
  <button type="submit">Bhejein</button>
</form>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  addMsg(text,'user');
  input.value='';
  const loading=addMsg('Soch raha hoon...','ai');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json();
    loading.textContent=data.reply || 'Error aaya.';
  }catch(err){loading.textContent='Connection error.';}
});
</script>
</body>
</html>
